apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: mysql-service
  namespace: internal-monitoring
  labels:
    storpool.com/env: production
    storpool.com/managed-by: internal-monitoring-automation
spec:
  honorLabels: true
  relabelConfigs:
    - sourceLabels: [ __address__ ]
      targetLabel: __address__
  staticConfigs: {{ lookup('template', 'manifests/monitoring/targets/mysql_service.yaml.j2') | from_yaml or [] }}
