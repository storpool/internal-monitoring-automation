- name: Deploying monitoring stack
  hosts: localhost
  pre_tasks:
    - import_tasks: tasks/add-helm-repositories.yaml
  tasks:
    - name: Deploying the blackbox-exporter
      kubernetes.core.helm:
        release_name: blackbox-exporter
        release_namespace: internal-monitoring
        chart_ref: prometheus-community/prometheus-blackbox-exporter
        values: "{{ lookup('file', 'helm/values/blackbox-exporter.yaml') | from_yaml }}"

    - name: Deploying the snmp-exporter
      kubernetes.core.helm:
        release_name: snmp-exporter
        release_namespace: internal-monitoring
        chart_ref: prometheus-community/prometheus-snmp-exporter
        values:
          fullnameOverride: snmp-exporter
          image:
            repository: cts.storpool.com/snmp-exporter/snmp-exporter
            tag: latest

    - name: Creating VictoriaMetrics components
      kubernetes.core.k8s:
        state: present
        resource_definition: "{{ lookup('file', manifest) | from_yaml }}"
        apply: yes
      loop:
        - victoriametrics/vmsingle-metrics.yaml
        - victoriametrics/vmagent-internal.yaml
        - victoriametrics/vmalert-internal.yaml
        - victoriametrics/vmalertmanagerconfig.yaml
        - victoriametrics/vmalertmanager-internal.yaml
      loop_control:
        loop_var: manifest

    - name: Creating a ConfigMap to hold Alertmanager templates
      kubernetes.core.k8s:
        state: present
        resource_definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: alertmanager-templates
            namespace: internal-monitoring
          data:
            slack.tmpl: "{{ lookup('file', 'alertmanager/templates/slack.tmpl') | replace('{{ alertmanager_internal_domain }}', alertmanager_internal_domain) }}"

    - name: Creating Kubernetes control plane metrics services
      kubernetes.core.k8s:
        resource_definition: "{{ lookup('file', manifest) | from_yaml }}"
      loop_control:
        loop_var: manifest
      loop: "{{ lookup('fileglob', 'kubernetes/*.yaml', wantlist=True) }}"

    - name: Creating Prometheus Kubernetes control plane monitoring resources
      kubernetes.core.k8s:
        state: present
        resource_definition: "{{ lookup('url', crd_url, split_lines=False) | from_yaml | ansible.utils.remove_keys(target=['namespace']) | combine(storpool_monitoring_labels, recursive=true) }}"
        namespace: internal-monitoring
      loop:
        - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-prometheusRule.yaml
        - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-serviceMonitorApiserver.yaml
        - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-serviceMonitorCoreDNS.yaml
        - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-serviceMonitorKubeControllerManager.yaml
        - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-serviceMonitorKubeScheduler.yaml
        - https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/main/manifests/kubernetesControlPlane-serviceMonitorKubelet.yaml
      loop_control:
        loop_var: crd_url
      register: applied_control_plane_resources

    - name: Creating Prometheus alerting rules
      kubernetes.core.k8s:
        state: present
        resource_definition:
          apiVersion: operator.victoriametrics.com/v1beta1
          kind: VMRule
          metadata:
            name: "{{ rules_file | basename | split('.') | first }}"
            namespace: internal-monitoring
            labels:
              storpool.com/env: production
              storpool.com/managed-by: internal-monitoring-automation
          spec: "{{ lookup('file', rules_file) | from_yaml }}"
      loop: "{{ lookup('fileglob', 'prometheus/rules/*.rules', wantlist=True) }}"
      loop_control:
        loop_var: rules_file
      register: applied_vm_rules

    - name: Listing the alerting rules labelled as managed by this repository
      kubernetes.core.k8s_info:
        api_version: operator.victoriametrics.com/v1beta1
        kind: VMRule
        namespace: internal-monitoring
        label_selectors:
          - storpool.com/managed-by=internal-monitoring-automation
      register: existing_vm_rules

    # Anything we previously created that the rules glob no longer produces is a leftover from
    # a .rules file that has since been deleted. The selector is the managed-by marker, not
    # storpool.com/env: production, so rules maintained by hand are never candidates. The
    # upstream PrometheusRule is converted into a same-named VMRule by the VictoriaMetrics
    # operator, so deleting that one would only start a delete/recreate fight; its name is
    # subtracted here rather than hardcoded so future upstream additions need no change. The
    # ownerReferences rejection is a second line of defence, because the operator's converter
    # leaves owner references off by default in several releases.
    - name: Selecting the orphaned alerting rules
      ansible.builtin.set_fact:
        orphaned_vm_rules: "{{ existing_vm_rules.resources
          | rejectattr('metadata.ownerReferences', 'defined')
          | map(attribute='metadata.name') | list
          | difference(applied_vm_rules.results | selectattr('result', 'defined')
                       | map(attribute='result.metadata.name') | list)
          | difference(applied_control_plane_resources.results | selectattr('result', 'defined')
                       | map(attribute='result') | selectattr('kind', 'eq', 'PrometheusRule')
                       | map(attribute='metadata.name') | list)
          | sort }}"

    - name: Reporting the orphaned alerting rules
      ansible.builtin.debug:
        msg: "Deleting orphaned VMRules: {{ orphaned_vm_rules | join(', ') }}"
      when: orphaned_vm_rules | length > 0

    - name: Refusing to delete an implausible number of alerting rules
      ansible.builtin.assert:
        that: orphaned_vm_rules | length <= (monitoring_prune_max | int)
        fail_msg: >-
          {{ orphaned_vm_rules | length }} VMRules look orphaned, over the monitoring_prune_max
          limit of {{ monitoring_prune_max }}. This usually means the rules glob or the label
          selector is wrong rather than that they are all stale. Review every name before
          raising the limit: {{ orphaned_vm_rules | join(', ') }}

    - name: Removing the orphaned alerting rules
      kubernetes.core.k8s:
        state: absent
        api_version: operator.victoriametrics.com/v1beta1
        kind: VMRule
        namespace: internal-monitoring
        name: "{{ vm_rule }}"
      loop: "{{ orphaned_vm_rules }}"
      loop_control:
        loop_var: vm_rule

    - name: Retrieving Alertmanager endpoints
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Endpoints
        namespace: internal-monitoring
        name: vmalertmanager-internal
      register: alertmanager_endpoints_result
      tags:
        - karma

    - name: Dumping Alertmanager endpoints
      ansible.builtin.debug:
        var: alertmanager_endpoints_result
        verbosity: 2
        
    - name: Deploying Karma alert dashboard
      kubernetes.core.k8s:
        state: present
        resource_definition: "{{ (lookup('template', manifest_path) | from_yaml) }}"
      loop:
        - manifests/karma/karma-configmap.yaml
        - manifests/karma/karma-deployment.yaml
        - manifests/karma/karma-service.yaml
        - manifests/karma/karma-ingressroute.yaml
      loop_control:
        loop_var: manifest_path
      vars:
        alertmanager_endpoint_subset: "{{ (alertmanager_endpoints_result.resources | first)['subsets'] | first }}"
      tags:
        - karma

    - name: Install Reloader in internal-monitoring namespace
      kubernetes.core.helm:
        name: reloader
        chart_ref: stakater/reloader
        release_namespace: internal-monitoring
        create_namespace: true
        values:
          watchGlobally: false

    - name: Check if fortigate-config exists
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: fortigate-config
        namespace: internal-monitoring
      register: fortigate_config

    - name: Create fortigate-config if missing
      kubernetes.core.k8s:
        state: present
        resource_definition:
          kind: ConfigMap
          metadata:
            name: fortigate-config
            namespace: internal-monitoring
          data:
            fortigate-key.yaml: |
                "https://fortigate:8443":
                    token: fortigate_api_token
          data:
      when: fortigate_config.resources | length == 0

    - name: Deploy Fortigate monitoring stack
      kubernetes.core.k8s:
        namespace: internal-monitoring
        resource_definition: "{{ lookup('file', manifest) | from_yaml }}"
      loop_control:
        loop_var: manifest
      loop: "{{ lookup('fileglob', 'fortigate/*.yaml', wantlist=True) }}"

    - name: Searching for the ipmi-exporter config secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: internal-monitoring
        name: "{{ ipmi_exporter_secret_name }}"
      register: ipmi_exporter_secret_result

    - name: Checking if the ipmi-exporter config secret exists
      ansible.builtin.assert:
        that: ipmi_exporter_secret_result.resources | length == 1
        fail_msg: >-
          Please define the {{ ipmi_exporter_secret_name }} secret holding ipmi.yml with the BMC
          credentials. See the IPMI/BMC Monitoring section of README.md.

    - name: Deploying the ipmi-exporter
      kubernetes.core.k8s:
        namespace: internal-monitoring
        resource_definition: "{{ lookup('file', manifest) | from_yaml }}"
      loop_control:
        loop_var: manifest
      loop: "{{ lookup('fileglob', 'ipmi-exporter/*.yaml', wantlist=True) }}"

    - name: Export VictoriaMetrics host
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: victoria-metrics
            namespace: internal-monitoring
          spec:
            entryPoints:
            - webinternal
            routes:
            - kind: Rule
              match: Host(`{{ victoria_metrics_external_endpoint }}`)
              services:
              - name: vmsingle-metrics
                port: 8429
      when: victoria_metrics_external_endpoint is defined

  vars_files:
    - vars/monitoring-stack.yaml
