---
- name: Checking if the VictoriaLogs password is defined
  ansible.builtin.assert:
    that:
      - vector_victorialogs_password is defined
      - vector_victorialogs_password | length > 0
    fail_msg: Please set the VictoriaLogs writer password via vector_victorialogs_password

- name: Checking if the VictoriaLogs URL is defined
  ansible.builtin.assert:
    that:
      - vector_victorialogs_url | length > 0
    fail_msg: Please set the VictoriaLogs endpoint via vector_victorialogs_url

- name: Checking if the host architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_architecture in vector_deb_architectures
    fail_msg: "No vector package for {{ ansible_architecture }}"

- name: Checking if the vector package checksum is defined
  ansible.builtin.assert:
    that:
      - vector_package in vector_checksums
    fail_msg: "No checksum for {{ vector_package }}, add it to vector_checksums"
  when:
    - ansible_pkg_mgr in ["apt", "dnf", "dnf5"]

- name: Creating the vector download directory
  ansible.builtin.file:
    path: /var/cache/vector
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ansible_pkg_mgr in ["apt", "dnf", "dnf5"]

- name: Downloading vector
  ansible.builtin.get_url:
    url: "{{ vector_release_url }}/{{ vector_package }}"
    dest: "/var/cache/vector/{{ vector_package }}"
    checksum: "sha256:{{ vector_checksums[vector_package] }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_pkg_mgr in ["apt", "dnf", "dnf5"]

- name: Installing vector via apt
  ansible.builtin.apt:
    deb: "/var/cache/vector/{{ vector_package }}"
  when:
    - ansible_pkg_mgr == "apt"
  notify: Restarting vector

- name: Installing vector via dnf
  ansible.builtin.dnf:
    name: "/var/cache/vector/{{ vector_package }}"
    state: present
    disable_gpg_check: true
  when:
    - ansible_pkg_mgr in ["dnf", "dnf5"]
  notify: Restarting vector

# The package postinst does this too, but only if the group existed at install time
- name: Allowing vector to read the journal
  ansible.builtin.user:
    name: vector
    groups: systemd-journal
    append: true
  notify: Restarting vector

- name: Installing tetragon
  ansible.builtin.include_tasks: tetragon.yml
  when: vector_tetragon_enabled | bool

- name: Adding the tetragon VRL program
  ansible.builtin.copy:
    dest: /etc/vector/tetragon.vrl
    src: "{{ 'tetragon-extended.vrl' if vector_tetragon_extended_enabled | bool else 'tetragon-minimal.vrl' }}"
    owner: root
    group: vector
    mode: "0640"
  when: vector_tetragon_enabled | bool
  notify: Restarting vector

- name: Configuring vector
  ansible.builtin.template:
    dest: /etc/vector/vector.yaml
    src: vector.yaml.j2
    owner: root
    group: vector
    mode: "0640"
    validate: /usr/bin/vector validate --no-environment --config-yaml %s
  notify: Restarting vector

- name: Creating vector drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/vector.service.d/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Creating vector oom score systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/vector.service.d/10-oom-score.conf
    src: vector-oom-score.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reloading systemd
    - Restarting vector

- name: Starting the vector service
  ansible.builtin.systemd_service:
    name: vector
    state: started
    enabled: true

- name: Flushing handlers
  ansible.builtin.meta: flush_handlers

- name: Checking if vector is healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:8686/health
    status_code: 200
  register: vector_health
  retries: 10
  delay: 3
  until: vector_health.status == 200
