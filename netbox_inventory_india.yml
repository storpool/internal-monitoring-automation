plugin: netbox.netbox.nb_inventory
validate_certs: true
config_context: true
plurals: false
query_filters:
  - region: "india"
  - status: "active"
device_query_filters:
  - has_primary_ip: "true"
interfaces: true
group_by:
  - site
compose:
  public_ipv4: >-
    interfaces | default([]) | map(attribute='ip_addresses') | flatten(levels=1)
    | selectattr('family.value', 'eq', 4)
    | selectattr('status.value', 'eq', 'active')
    | map(attribute='address') | map('regex_replace', '/.*$', '')
    | reject('match', '^(10|127)\.|^169\.254\.|^192\.168\.|^172\.(1[6-9]|2[0-9]|3[01])\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.')
    | unique | list
  public_ipv6: >-
    interfaces | default([]) | map(attribute='ip_addresses') | flatten(levels=1)
    | selectattr('family.value', 'eq', 6)
    | selectattr('status.value', 'eq', 'active')
    | map(attribute='address') | map('regex_replace', '/.*$', '')
    | select('match', '^[23]') | reject('match', '(?i)^2001:0?db8:')
    | unique | list

groups:
  baremetal_machines: '(role == "server" or role == "router") and not is_virtual and "omit-monitor" not in tags'
  virtual_machines: '(role == "server" or role == "router") and is_virtual and "omit-monitor" not in tags'
  deploy_node_exporter: '"monitor-autodeploy" in tags'
  deploy_vector: '"vector-autodeploy" in tags'
  network_devices: '("switch" in role or role == "ap") and "omit-monitor" not in tags'
  power_devices: '(role == "pdu" or role == "ups") and "omit-monitor" not in tags'
  routers: 'role == "router" and "omit-monitor" not in tags'
  daily_upgrades: '"autoupdate" in tags'
  mysql_hosts: 'role == "server" and (services | select_attr("name", "eq", "mysql") | list | length == 1)'
  intel_baremetal: 'role == "server" and (custom_fields["cpu_maker"]["value"] is defined and custom_fields["cpu_maker"]["value"] == "Intel") and "omit-monitor" not in tags'
  amd_baremetal: 'role == "server" and (custom_fields["cpu_maker"]["value"] is defined and custom_fields["cpu_maker"]["value"] == "AMD") and "omit-monitor" not in tags'
  dns_servers: 'role == "router" and (services | select_attr("name", "eq", "Internal DNS") | list | length == 1)'
  fortigate_firewalls: 'role == "firewall" and platform == "fortios" and "omit-monitor" not in tags'
  public_ipv4_hosts: 'public_ipv4 | length > 0 and "omit-monitor" not in tags'
  public_ipv6_hosts: 'public_ipv6 | length > 0 and "omit-monitor" not in tags'
  public_hosts: '(public_ipv4 | length > 0 or public_ipv6 | length > 0) and "omit-monitor" not in tags'
