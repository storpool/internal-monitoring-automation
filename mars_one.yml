plugin: "netcho.opennebula.opennebula"
one_hostname_preference: name
strict: true
use_extra_vars: true

compose:
  location: "'mars'"
  ansible_host: name if "." in name else ((name | replace(" ", "")) + "." + (network_id_domain_map | dict2items(key_name="network_id", value_name="domain_name") | first)["domain_name"] if network_id_domain_map | length else (nic | selectattr("ip", "defined") | first)["ip"])
  running: state == "active" and lcm_state == "running"
  services: dict(user_attributes.services | split(",") | map("split", ":")) if user_attributes.services is defined else {}
  healthcheck_url: user_attributes.healthcheck_url | split(",") if user_attributes.healthcheck_url is defined else []
  public_ipv4: >-
    nic | map(attribute='ip', default='') | select
    | reject('match', '^(10|127)\.|^169\.254\.|^192\.168\.|^172\.(1[6-9]|2[0-9]|3[01])\.|^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.')
    | list
  public_ipv6: >-
    ((nic | map(attribute='ip6_global', default='') | list)
     + (nic | map(attribute='ip6', default='') | list))
    | select | select('match', '^[23]') | reject('match', '(?i)^2001:0?db8:')
    | unique | list
groups:
  virtual_machines: 'user_attributes.labels is defined and "Production" in user_attributes.labels and running | bool'
  jenkins_hosts: 'user_attributes.labels is defined and "Production" in user_attributes.labels and "jenkins" in user_attributes.labels and running | bool'
  daily_upgrades: 'user_attributes.labels is defined and "autoupdate" in user_attributes.labels and running | bool'
  mysql_hosts: 'user_attributes.labels is defined and "mysql" in user_attributes.labels and running | bool'
  postgresql_hosts: 'user_attributes.labels is defined and "postgresql" in user_attributes.labels and running | bool'
  deploy_node_exporter: 'user_attributes.labels is defined and "Production" in user_attributes.labels and "no_monitor_deploy" not in user_attributes.labels and running | bool'
  influxdb_service: 'user_attributes.labels is defined and "Production" in user_attributes.labels and services is defined and "influxdb" in services and running | bool'
  ssh_service: 'user_attributes.labels is defined and "Production" in user_attributes.labels and services is defined and "ssh" in services and running | bool'
  web_service: 'user_attributes.labels is defined and "Production" in user_attributes.labels and healthcheck_url | length > 0 and running | bool'
  ipsec_service: 'user_attributes.labels is defined and "Production" in user_attributes.labels and "ipsec" in user_attributes.labels and running | bool'
  process_exporter: 'user_attributes.labels is defined and "Production" in user_attributes.labels and "process-exporter" in user_attributes.labels and running | bool'
  deploy_vector: 'user_attributes.labels is defined and "Production" in user_attributes.labels and "vector" in user_attributes.labels and running | bool'
  public_ipv4_hosts: 'public_ipv4 | length > 0 and running | bool'
  public_ipv6_hosts: 'public_ipv6 | length > 0 and running | bool'
  public_hosts: '(public_ipv4 | length > 0 or public_ipv6 | length > 0) and running | bool'

